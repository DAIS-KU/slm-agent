planning_prompt: |
    You have one question to answer. Make a plan to reach the goal. Do not actually compute the answer. 
    Here is the task:
    {{task}}

planning_with_examples_prompt: |
    You have one question to answer. Make a plan to reach the goal. Do not actually compute the answer. 
    Here is the task:
    {{task}}

    Here are similar task and their plannings:
    {{examples}} 

progressive_knowledge_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Instead, analyze what would be required to determine the correct answer.
    Your job is to identify the necessary meta-level components needed to solve the task.
    You must output strictly in the following JSON format:

    {
        "goal": "Describe the ultimate objective of the task",
        "what_to_derive": "Specify the key quantity, relationship, or conclusion that must be derived to determine the answer",
        "domain": "Indicate the relevant academic field or problem domain",
        "concepts": ["List the essential concepts, principles, theories, formulas, or laws required"]
    }

    ⚠️ Do NOT include the solution.
    ⚠️ Do NOT show intermediate reasoning steps.
    ⚠️ Only provide meta-level analysis of what is required to solve the task.

    TARGET TASK:
    {{task}}

    SIMILAR TASKS:
    {{similar_blocks}}

progressive_ci_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Your job is to identify the necessary meta-level components needed to solve the task.
    You must output strictly in the following JSON format:

    {
    "constraints": "Describe the conditions, variables, assumptions, and the key quantities, relationships, or conclusions that must be derived to solve the problem.",
    "instructions": "Specify the required response format, intent, and any additional user requirements for the answer."
    }

    ⚠️ Do NOT include the conclusion or answer.
    ⚠️ Do NOT show intermediate reasoning steps.
    ⚠️ Only provide meta-level analysis of what is required to solve the task.

    TASK:
    {{task}}

    SIMILAR TASKS:
    {{similar_blocks}}


progressive_approach_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Instead, analyze what would be required to determine the correct answer.
    Your job is to identify the necessary meta-level components needed to solve the task.
    You must output strictly in the following JSON format:

    {
    "approach": "Provide a concise solution that explains the decision-making rationale based on the knowledge, constraints, and instructions below."
    }

    ⚠️ Do NOT include the conclusion or answer.
    ⚠️ Do NOT show intermediate reasoning steps.
    ⚠️ Only provide meta-level analysis of what is required to solve the task.

    TARGET TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    CONSTRAINTS/INSTRUCTIONS:
    {{constraints_instructions}}

    SIMILAR TASKS:
    {{similar_blocks}}


progressive_plan_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Instead, analyze what would be required to determine the correct answer.
    You must output strictly in the following JSON format:
    
    {
    "plan": {
        "steps": "Provide an actionable, step-by-step plan to solve the task.",
        "rationale": "Briefly explain why this plan aligns with the given knowledge, constraints, instructions, and approach."
        }
    }

    ⚠️ Do NOT include the conclusion or answer.
    ⚠️ Do NOT show intermediate reasoning steps.

    TARGET TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    CONSTRAINTS/INSTRUCTIONS:
    {{constraints_instructions}}

    APPROACH:
    {{approach}}

    SIMILAR TASKS:
    {{similar_blocks}}

extract_task_spec_prompt: |
    You are an expert task analyzer.
    Given a task, extract a structured TaskSpec.

    TASK:
    {{task}}

    TaskSpec fields:
    - task: summerized task text
    - domain: field/area of knowledge
    - objective: success criteria intended outcome or what needed to be done

    Output strict JSON only:
    {
        "task": "",
        "domain": "",
        "objective": "",
    }

transfer_ka_prompt: |
    You are an expert task analyzer.
    Return the knowledge and approach transferred from the reference task to the goal task based on their similarities and differences.

    GOAL TASK:
    {{goal_task_spec}}

    REFERENCE TASK:
    {{ref_task_spec}}

    Output strict JSON:
    {
        "knowledge_transferred": "",
        "approach_transferred": ""
    }

final_ka_prompt: |
    You are an expert task designer.
    Given a TARGET task and proposed knowledge and approaches derived from similar tasks,
    determine the final knowledge and approach required to successfully solve the target task.

    Instructions:
    - Use the proposed items as candidates, not as mandatory.
    - Remove irrelevant or redundant elements.
    - Adapt items if necessary to better fit the target task.
    - Add new elements only if critical gaps exist.

    Return STRICT JSON only:
    {
        "final_knowledge": "...",
        "final_approach": "..."
    }

    TARGET TASK:
    {{task}}

    PROPOSED KNOWLEDGE & APPROACH:
    {{proposed_ka}}


recontextualized_plan_prompt: |
    You are an expert planning agent.
    Write a Plan for the TARGET TASK.

    Follow these rules STRICTLY:
    - The plan MUST be grounded in Knowledge, Contraints_Instructions and Approach.
    - Explicitly expose decision-making rationale at key steps.
    - Show how constraints influence each major decision.
    - Include validation/check steps if necessary.
    - Do NOT output the final solution to the task.

    TASK:
    {{task}}
    
    KNOWLEDGE/APPROACH:
    {{knowledge_approach}}

    CONSTRAINTS/INSTRUCTIONS:
    {{constraints_instructions}}

plan_to_subtasks_prompt: |
    Convert the following plan into executable subtasks.

    Requirements:
    - Each subtask must explicitly include ALL required variables, values, objects, definitions, data, assumptions, and constraints from the original task to solve each subtask independently.
    - Do NOT restate the plan.
    - Do NOT solve the task.
    - Make each subtask independently solvable.
    - Replace abstract reasoning with explicit actions.
    - Specify exact expected_output format.

    Return STRICT JSON only:
    [
        {
            "subtask": "...",
            "inputs": "...",
            "procedure": "..."
            "expected_output": "..."
        }
    ]
    
    [task]
    {{task}}

    [plan]
    {{plan}}

plan_to_subtasks_with_examples_prompt: |
    Convert the following plan into executable subtasks.

    Requirements:
    - Each subtask must explicitly include ALL required variables, values, objects, definitions, data, assumptions, and constraints from the original task to solve each subtask independently.
    - Do NOT restate the plan.
    - Do NOT solve the task.
    - Make each subtask independently solvable.
    - Replace abstract reasoning with explicit actions.
    - Specify exact expected_output format.

    Return STRICT JSON only:
    [
        {
            "subtask": "...",
            "inputs": "...",
            "procedure": "..."
            "expected_output": "..."
        }
    ]

    [task]
    {{task}}

    [plan]
    {{plan}}

    [subtask example]
    {
    "subtask": "Compute the lower central series of the given Lie algebra.",
    "inputs": [
        "Basis of Lie algebra g: {e1, e2, e3, e4, e5, e6}",
        "Bracket relations: [e1,e2]=e3, [e1,e3]=e4, [e1,e5]=e6",
        "All other brackets between basis elements are zero",
        "Definition: Lower central series defined by g1=g and g_{k+1}=[g_k,g]"
    ],
    "procedure": [
        "1. Set g1 = span{e1,e2,e3,e4,e5,e6}.",
        "2. Compute all brackets [ei,ej] using the given relations to obtain g2.",
        "3. Compute all brackets between elements of g2 and g to obtain g3.",
        "4. Continue until g_k = {0}.",
        "5. Express each g_k as a span of basis elements."
    ],
    "expected_output": "An ordered list of subspaces g1, g2, ..., gk written explicitly as spans of basis elements."
    }
    {
    "subtask": "Compute the average salary from the provided dataset.",
    "inputs": [
        "CSV file with columns: id (integer), name (string), salary (float)",
        "File path: data/employees.csv",
        "Assume file contains header row",
        "Ignore rows where salary is missing or non-numeric"
    ],
    "procedure": [
        "1. Open the file data/employees.csv.",
        "2. Read the CSV file and skip the header row.",
        "3. Extract the salary column values.",
        "4. Remove entries that are missing or not numeric.",
        "5. Compute the arithmetic mean of remaining salary values."
    ],
    "expected_output": "A single floating-point number representing the average salary."
    }
    {
    "subtask": "Compute the average salary from the provided dataset.",
    "inputs": [
        "CSV file with columns: id (integer), name (string), salary (float)",
        "File path: data/employees.csv",
        "Assume file contains header row",
        "Ignore rows where salary is missing or non-numeric"
    ],
    "procedure": [
        "1. Address the customer by name.",
        "2. Mention the order number and delay duration.",
        "3. State the reason for the delay.",
        "4. Provide the compensation code and explain its usage.",
        "5. Close the email politely."
    ],
    "expected_output": "A single floating-point number representing the average salary."
    }

solve_subtask_prompt: |
    Solve the given subtask using the retrieved examples as guidance.
    Compute the target variable/value/entity specified in expected_output.

    Return STRICT JSON:
    {
        "output": <COMPUTED_TARGET>
    }

    Subtask:
    {{subtask}}

    Input:
    {{inputs}}

    Procedure:
    {{procedure}}

    Expected_output:
    {{expected_output}}

    Retrieved examples:
    {{do_examples}}

approach_prompt: |
    Extract the following information for the given task.
    - decision_criterion: An intermediate, task-specific decision quantity or structure that is established/produced/derived to select the final answer.
    - approach: explicit methodology/paradigm/algorithm and HOW it is used to obtain decision_criterion.

    Return STRICT JSON:
    {
        "decision_criterion": "...", 
        "approach": "..."
    }

    TASK:
    {{task}}}

    SIMILAR TASKS:
    {{examples}}


approach_to_plan_prompt: |
    Develop a problem-solving plan by referring to the decision-making criteria below and the approach used to derive them.

    Return STRICT JSON:
    {
        "plan": {"type":"array","items":{"type":"string"}}
    }

    TASK:
    {{task}}}

    WHAT TO DERIVE:
    {{decision_criterion}}

    APPROACH:
    {{approach}}

    OBSERVATION:
    {{observation}}

generate_required_outcomes_prompt: |
    Enrich a steps-only plan by adding required_outcomes.
    We want to group tasks that are scattered across multiple Steps into Subtasks based on the same Outcome they produce.
    Multiple Steps can contribute to the same Outcome (this is the key point).
    An Outcome must be verifiable (it should be possible to determine whether it is complete).
    An Outcome must be atomic enough to be defined as a Subtask (if it is too large, it should be decomposed).

    Return STRICT JSON:
    {
        "plan": {
            "type": "array",
            "items": {
                "type": "object",
                "additionalProperties": False,
                "properties": {
                    "step": {"type": "string"},
                    "required_outcomes": {"type": "array", "items": {"type": "string"}},
                },
                "required": ["step", "required_outcomes"],
            },
        }
    }

    TASK:
    {{task}}}

    STEPS-ONLY PLAN:
    {{plan}}}

bundle_outcomes_prompt: |
    We plan to categorize the outcomes and define the specific subtasks needed to deliver each outcome.
    Reduce ambiguity by clustering/normalizing artifacts into a small set of canonical bundles.
    - Create bundles by shared REQUIRED_OUTCOME (same end-state), even if the contributing items come from different steps.
    - Each bundle must have:
    - bundle_id: "RO1", "RO2", ...
    - outcome_name: short noun phrase describing the state
    - outcome_description: what must be true in that state
    - included_items: subset of input strings grouped here (verbatim)
    - normalized_outcomes: canonical outcome state strings (verifiable, testable)
    - Prefer fewer bundles with clear scope.

    Return STRICT JSON:
    {
        "bundles": [
            {
            "bundle_id": "RO1",
            "bundle_name": "Outcome name",
            "bundle_goal": "Why this outcome matters",
            "included_steps": ["STEP_1", "STEP_2"],
            "required_outcomes": ["OUTCOME_A", "OUTCOME_B"],
            }
        ]
    }
    
    Input outcomes:
    {{all_outcomes}}
    
bundle_to_subtak_text_prompt: |
    Generate one fully self-contained subtask_text per bundle.
    - subtask_text must be solvable in isolation.
    - Include only minimal necessary context (no full original texts).
    - Must have sections:
      1) Objective
      2) Given (explicit inputs available)
      3) Steps (actionable)
      4) Outputs (MUST match produces exactly)
      5) Constraints

    Return STRICT JSON:
    {
        "subtasks": [
            {
            "bundle_id": "RO2",
            "required_outcomes": ["OUTCOME_C"],
            "subtask_text": "..."
            }
        ]
    }
    
    BUNDLES:
    {{bundles}}

outcome_to_subtasks_prompt: |
    Extract structured fields from the given self-contained subtask_text.
    Return:
    - subtask_title: concise
    - task_spec: problem_type, domain, decision_criterion, approach (scoped to this subtask)
        - decision_criterion: An intermediate, task-specific decision quantity or structure that is established/produced/derived to select the final answer.
        - approach: explicit methodology/paradigm/algorithm and HOW it is used to obtain decision_criterion.
    - checklist: conditions and items that must be checked to verify whether the task has been properly carried out
    
    Return STRICT JSON:
    {
        "subtask_title": "...",
        "task_spec": {
            "problem_type": "...",
            "domain": ["..."],
            "approach": ["..."],
            "decision_criterion": ["..."]
        },
        "checklist": [
            "...",
            "..."
        ]
    }
    
    required_outcomes:
    {required_outcomes}
    
    subtask_text:
    {subtask_text}

subtask_plan_prmopt: |
    Develop a problem-solving plan by referring to the decision-making criteria below and the approach used to derive them.
    Do not include the final answer or conclusion in the plan under any circumstances.

    Return STRICT JSON:
    {
        "plan": {"type":"array","items":{"type":"string"}}
    }

    SUBTASK:
    {{subtask}}}

    SIMILAR SUBTASKS:
    {{examples}}

task_analysis_prompt: |
    Given a TARGET TASK, derive its decision criterion and approach.
    - decision_criterion:
    An intermediate, task-specific decision quantity or structure that is established/produced/derived to select the final answer.
    - approach:
    Must explicitly state:
    (a) which domain concept/definition(s) are used 
    (b) which domain methodology/paradigm/algorithm is used
    (c) how these are applied step-by-step to derive the decision_criterion.
    - Requirement:
    Once decision_criterion is satisfied, the final answer must be directly obtainable (no additional unknown leaps).

    Return STRICT JSON only:
    {
        "decision_criterion": "...",
        "approach": "..."
    }

    TARGET TASK:
    {{task}}

    SIMILAR TASKS AND THEIR ANALYSES:
    {{similar_blocks}}

step_actions_from_augmented_prompt: |
    Generate concrete executable actions for the TARGET STEP.

    Use the REFERENCE STEPS below as patterns — each shows an original_step and its step_executions.
    Adapt the pattern to the TARGET STEP; do NOT copy verbatim.

    Rules:
    - Each action must be a single concrete operation (e.g. "Compute X using formula Y", "Retrieve Z from source W").
    - Do NOT solve the task or state any final answer.

    Return STRICT JSON only:
    {
        "actions": ["action 1", "action 2", "..."]
    }

    TARGET STEP:
    {{step}}

    REFERENCE STEPS AND EXECUTIONS:
    {{reference_blocks}}

step_actions_from_subtask_prompt: |
    Generate concrete executable actions for the TARGET STEP.

    Use the RETRIEVED SUBTASK ACTIONS below as patterns.
    Adapt them to the TARGET STEP context; do NOT copy verbatim.

    Rules:
    - Each action must be a single concrete operation.
    - Do NOT solve the task or state any final answer.

    Return STRICT JSON only:
    {
        "actions": ["action 1", "action 2", "..."]
    }

    TARGET STEP:
    {{step}}

    RETRIEVED SUBTASK ACTIONS:
    {{retrieved_actions}}

task_analysis_plan_prompt: |
    Generate a step-by-step plan to solve the TARGET TASK.

    Use the DECISION CRITERION and APPROACH as your core strategy.
    Reference the SIMILAR PLAN STEPS for structural patterns — adapt them to the TARGET TASK.

    Rules:
    - Each step must be concrete and actionable.
    - Steps must collectively produce the DECISION CRITERION.
    - Do NOT solve the task or state the final answer.

    Return STRICT JSON only:
    {
        "steps": ["step 1", "step 2", "..."]
    }

    TARGET TASK:
    {{task}}

    DECISION CRITERION:
    {{decision_criterion}}

    APPROACH:
    {{approach}}

    SIMILAR PLAN STEPS:
    {{similar_blocks}}