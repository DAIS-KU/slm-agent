planning_prompt: |
    You have one question to answer. Make a plan to reach the goal. Do not actually compute the answer. 
    Here is the task:
    {{task}}

planning_with_examples_prompt: |
    You have one question to answer. Make a plan to reach the goal. Do not actually compute the answer. 
    Here is the task:
    {{task}}

    Here are similar task and their plannings:
    {{examples}} 

progressive_knowledge_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Instead, analyze what would be required to determine the correct answer.
    Your job is to identify the necessary meta-level components needed to solve the task.
    You must output strictly in the following JSON format:

    {
        "goal": "Describe the ultimate objective of the task",
        "what_to_derive": "Specify the key quantity, relationship, or conclusion that must be derived to determine the answer",
        "domain": "Indicate the relevant academic field or problem domain",
        "concepts": ["List the essential concepts, principles, theories, formulas, or laws required"]
    }

    ⚠️ Do NOT include the solution.
    ⚠️ Do NOT show intermediate reasoning steps.
    ⚠️ Only provide meta-level analysis of what is required to solve the task.

    TARGET TASK:
    {{task}}

    SIMILAR TASKS:
    {{similar_blocks}}

progressive_ci_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Your job is to identify the necessary meta-level components needed to solve the task.
    You must output strictly in the following JSON format:

    {
    "constraints": "Describe the conditions, variables, assumptions, and the key quantities, relationships, or conclusions that must be derived to solve the problem.",
    "instructions": "Specify the required response format, intent, and any additional user requirements for the answer."
    }

    ⚠️ Do NOT include the conclusion or answer.
    ⚠️ Do NOT show intermediate reasoning steps.
    ⚠️ Only provide meta-level analysis of what is required to solve the task.

    TASK:
    {{task}}

    SIMILAR TASKS:
    {{similar_blocks}}


progressive_approach_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Instead, analyze what would be required to determine the correct answer.
    Your job is to identify the necessary meta-level components needed to solve the task.
    You must output strictly in the following JSON format:

    {
    "approach": "Provide a concise solution that explains the decision-making rationale based on the knowledge, constraints, and instructions below."
    }

    ⚠️ Do NOT include the conclusion or answer.
    ⚠️ Do NOT show intermediate reasoning steps.
    ⚠️ Only provide meta-level analysis of what is required to solve the task.

    TARGET TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    CONSTRAINTS/INSTRUCTIONS:
    {{constraints_instructions}}

    SIMILAR TASKS:
    {{similar_blocks}}


progressive_plan_prompt: |
    Given a TASK, do NOT solve it and do NOT derive the final answer.
    Instead, analyze what would be required to determine the correct answer.
    You must output strictly in the following JSON format:
    
    {
    "plan": {
        "steps": "Provide an actionable, step-by-step plan to solve the task.",
        "rationale": "Briefly explain why this plan aligns with the given knowledge, constraints, instructions, and approach."
        }
    }

    ⚠️ Do NOT include the conclusion or answer.
    ⚠️ Do NOT show intermediate reasoning steps.

    TARGET TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    CONSTRAINTS/INSTRUCTIONS:
    {{constraints_instructions}}

    APPROACH:
    {{approach}}

    SIMILAR TASKS:
    {{similar_blocks}}

extract_task_spec_prompt: |
    You are an expert task analyzer.
    Given a task, extract a structured TaskSpec.

    TASK:
    {{task}}

    TaskSpec fields:
    - task: summerized task text
    - domain: field/area of knowledge
    - objective: success criteria intended outcome or what needed to be done

    Output strict JSON only:
    {
        "task": "",
        "domain": "",
        "objective": "",
    }

transfer_ka_prompt: |
    You are an expert task analyzer.
    Return the knowledge and approach transferred from the reference task to the goal task based on their similarities and differences.

    GOAL TASK:
    {{goal_task_spec}}

    REFERENCE TASK:
    {{ref_task_spec}}

    Output strict JSON:
    {
        "knowledge_transferred": "",
        "approach_transferred": ""
    }

final_ka_prompt: |
    You are an expert task designer.
    Given a TARGET task and proposed knowledge and approaches derived from similar tasks,
    determine the final knowledge and approach required to successfully solve the target task.

    Instructions:
    - Use the proposed items as candidates, not as mandatory.
    - Remove irrelevant or redundant elements.
    - Adapt items if necessary to better fit the target task.
    - Add new elements only if critical gaps exist.

    Return STRICT JSON only:
    {
        "final_knowledge": "...",
        "final_approach": "..."
    }

    TARGET TASK:
    {{task}}

    PROPOSED KNOWLEDGE & APPROACH:
    {{proposed_ka}}


recontextualized_plan_prompt: |
    You are an expert planning agent.
    Write a Plan for the TARGET TASK.

    Follow these rules STRICTLY:
    - The plan MUST be grounded in Knowledge, Contraints_Instructions and Approach.
    - Explicitly expose decision-making rationale at key steps.
    - Show how constraints influence each major decision.
    - Include validation/check steps if necessary.
    - Do NOT output the final solution to the task.

    TASK:
    {{task}}
    
    KNOWLEDGE/APPROACH:
    {{knowledge_approach}}

    CONSTRAINTS/INSTRUCTIONS:
    {{constraints_instructions}}

plan_to_subtasks_prompt: |
    Convert the following plan into executable subtasks.

    Requirements:
    - Each subtask must explicitly include ALL required variables, values, objects, definitions, data, assumptions, and constraints from the original task to solve each subtask independently.
    - Do NOT restate the plan.
    - Do NOT solve the task.
    - Make each subtask independently solvable.
    - Replace abstract reasoning with explicit actions.
    - Specify exact expected_output format.

    Return STRICT JSON only:
    [
        {
            "subtask": "...",
            "procedure": "..."
            "expected_output": "..."
        }
    ]
    
    [task]
    {{task}}

    [plan]
    {{plan}}

plan_to_subtasks_with_examples_prompt: |
    Convert the following plan into executable subtasks.

    Requirements:
    - Each subtask must explicitly include ALL required variables, values, objects, definitions, data, assumptions, and constraints from the original task to solve each subtask independently.
    - Do NOT restate the plan.
    - Do NOT solve the task.
    - Make each subtask independently solvable.
    - Replace abstract reasoning with explicit actions.
    - Specify exact expected_output format.

    Return STRICT JSON only:
    [
        {
            "subtask": "...",
            "procedure": "..."
            "expected_output": "..."
        }
    ]

    [task]
    {{task}}

    [plan]
    {{plan}}

    [subtask example]
    {
    "subtask": "Compute the lower central series of the given Lie algebra.",
    "inputs": [
        "Basis of Lie algebra g: {e1, e2, e3, e4, e5, e6}",
        "Bracket relations: [e1,e2]=e3, [e1,e3]=e4, [e1,e5]=e6",
        "All other brackets between basis elements are zero",
        "Definition: Lower central series defined by g1=g and g_{k+1}=[g_k,g]"
    ],
    "procedure": [
        "1. Set g1 = span{e1,e2,e3,e4,e5,e6}.",
        "2. Compute all brackets [ei,ej] using the given relations to obtain g2.",
        "3. Compute all brackets between elements of g2 and g to obtain g3.",
        "4. Continue until g_k = {0}.",
        "5. Express each g_k as a span of basis elements."
    ],
    "expected_output": "An ordered list of subspaces g1, g2, ..., gk written explicitly as spans of basis elements."
    }
    {
    "subtask": "Compute the average salary from the provided dataset.",
    "inputs": [
        "CSV file with columns: id (integer), name (string), salary (float)",
        "File path: data/employees.csv",
        "Assume file contains header row",
        "Ignore rows where salary is missing or non-numeric"
    ],
    "procedure": [
        "1. Open the file data/employees.csv.",
        "2. Read the CSV file and skip the header row.",
        "3. Extract the salary column values.",
        "4. Remove entries that are missing or not numeric.",
        "5. Compute the arithmetic mean of remaining salary values."
    ],
    "expected_output": "A single floating-point number representing the average salary."
    }
    {
    "subtask": "Compute the average salary from the provided dataset.",
    "inputs": [
        "CSV file with columns: id (integer), name (string), salary (float)",
        "File path: data/employees.csv",
        "Assume file contains header row",
        "Ignore rows where salary is missing or non-numeric"
    ],
    "procedure": [
        "1. Address the customer by name.",
        "2. Mention the order number and delay duration.",
        "3. State the reason for the delay.",
        "4. Provide the compensation code and explain its usage.",
        "5. Close the email politely."
    ],
    "expected_output": "A single floating-point number representing the average salary."
    }

solve_subtask_prompt: |
    Solve the given subtask using the retrieved examples as guidance.
    Compute the target variable/value/entity specified in expected_output.

    Return STRICT JSON:
    {
        "output": <COMPUTED_TARGET>
    }

    Subtask:
    {{subtask}}

    Expected_output:
    {{expected_output}}

    Retrieved examples:
    {{do_examples}}