task_classification_prompt: |
    Given the task below, select all applicable task types and domains from the predefined lists.
    Choose only values that appear in the provided lists. You may select multiple values.

    TASK_TYPES (choose one or more):
    {{task_types}}

    DOMAINS (choose one or more):
    {{domains}}

    Return STRICT JSON (no extra keys, no prose outside the JSON):
    {
        "task_type_normalized": ["<type1>", ...],
        "domain_normalized": ["<domain1>", ...]
    }

    TASK:
    {{task}}}


task_classification_path_prompt: |
    Classify the given task into a 3-level hierarchical type_task path and domain path.
    Each path has exactly 3 levels separated by "/" going from general to specific.

    type_task path level-1 options: problem_solving, information_retrieval, analysis, decision_making, engineering
    type_task path level-2 examples (under problem_solving): mathematical, logical, scientific, conceptual
    type_task path level-3 examples: computation, proof, geometry, classification, reasoning, biology, chemistry, physics

    domain path level-1 options: science, technology, humanities, business, medicine, arts
    domain path level-2 examples: mathematics, physics, chemistry, biology, statistics, computer_science, social_sciences, history, law, economics
    domain path level-3 examples: algebra, analysis, geometry, general, algorithms, logic, education, finance

    Return STRICT JSON (no extra keys, no prose outside the JSON):
    {
        "type_task_path": "<level1>/<level2>/<level3>",
        "domain_path": "<level1>/<level2>/<level3>"
    }

    TASK:
    {{task}}


knowledge_prompt: |
    Extract the domain knowledge required to understand and solve the given task.
    Provide both:
        (a) declarative knowledge: domain concepts and definitions used
        (b) procedural knowledge: methodology, paradigm, or algorithm to apply
    Return only the knowledge as plain text. Do NOT include the direct answer.

    TASK:
    {{task}}

    SIMILAR TASKS:
    {{examples}}


plan_prompt: |
    Develop a high-level plan of no more than 10 steps to solve the given task based only on the provided knowledge and similar tasks.
    The plan must not include the final answer and the final conclusion.

    Requirements:
    - Use the knowledge explicitly and progressively in each step.
    - Derive a decision criterion: an intermediate, task-specific quantity, rule, or structure that can be used to select the answer.

    Strict Output Format:
    - <step>
    - <step>
    - ...

    TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    SIMILAR TASKS:
    {{examples}}


instance_prompt: |
    Generate a concrete execution instance that grounds the given plan into specific, actionable steps with actual values and reasoning.
    The instance should demonstrate exactly how to apply the plan to THIS task, showing intermediate computations and logical deductions.

    Requirements:
    - Walk through each plan step with concrete values from the task.
    - Show actual computations, lookups, or reasoning steps.
    - Do NOT reveal or guess the final answer — stop just before the conclusion.

    TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    PLAN:
    {{plan}}

    SIMILAR INSTANCES:
    {{examples}}


refine_knowledge_prompt: |
    You generated domain knowledge for a task. A Decision Guide identifies failure patterns observed in similar tasks.
    Refine the generated knowledge to address the failures. Only modify what the guide says is insufficient or wrong.
    Preserve all correct parts. Return the full refined knowledge as plain text.

    TASK:
    {{task}}

    GENERATED KNOWLEDGE:
    {{draft}}

    DECISION GUIDE:
    {{decision_guide}}


refine_plan_prompt: |
    You generated a solution plan for a task. A Decision Guide identifies failure patterns observed in similar tasks.
    Refine the generated plan to address the failures. Only modify steps that the guide says are wrong or missing.
    Preserve all correct steps. Return the full refined plan as a bullet list.

    TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    GENERATED PLAN:
    {{draft}}

    DECISION GUIDE:
    {{decision_guide}}


refine_instance_prompt: |
    You generated a concrete execution instance for a task. A Decision Guide identifies failure patterns observed in similar tasks.
    Refine the instance to fix the failures identified in the guide. Only modify what is incorrect or incomplete.
    Preserve all correct parts. Return the full refined execution instance.

    TASK:
    {{task}}

    KNOWLEDGE:
    {{knowledge}}

    PLAN:
    {{plan}}

    GENERATED INSTANCE:
    {{draft}}

    DECISION GUIDE:
    {{decision_guide}}


decision_guide_prompt: |
    Based on the retrieved similar tasks and their known failure patterns, generate a Decision Guide for solving the given task.
    The guide should identify the most likely failure modes and how to avoid them.

    For each potential failure, provide:
    - Failure: a specific failure phenomenon that could occur
    - Cause: the root cause (misunderstanding, wrong strategy, poor execution, etc.)
    - Correction: concrete guidance to avoid or fix the failure

    Return STRICT JSON array (no prose outside JSON):
    [
        {
            "level": "knowledge" | "plan" | "instance",
            "failure": "<failure description>",
            "cause": "<root cause>",
            "correction": "<how to correct it>"
        },
        ...
    ]

    TASK:
    {{task}}

    SIMILAR TASK GUIDES:
    {{examples}}
