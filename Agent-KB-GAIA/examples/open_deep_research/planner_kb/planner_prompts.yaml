approach_prompt: |
    Extract the following information for the given task.
    - knowledge: Background knowledge required to understand/solve the problem (core concepts, definitions, necessary theorems/tools)
    - approach:
        (a) which domain concept/definition(s) are used
        (b) which domain methodology/paradigm/algorithm is used
        (c) how these are applied step-by-step to derive the decision criterion(an intermediate, task-specific decision quantity or structure that is established/produced/derived to select the final answer).
        (d) once decision criterion is satisfied, the final answer must be directly obtainable (no additional unknown leaps).

    Return STRICT JSON:
    {
        "knowledge": "...",
        "approach": "..."
    }

    TASK:
    {{task}}}

    SIMILAR TASKS:
    {{examples}}


approach_to_plan_prompt: |
    Develop a problem-solving plan by referring to the decision-making criteria below and the approach used to derive them.
    Strict Output Format (no extra keys, no prose outside fields):
        - <step>
        - <step>
        ...

    TASK:
    {{task}}}

    APPROACH:
    {{approach}}

    OBSERVATION:
    {{observation}}

    SIMILAR TASKS:
    {{examples}}
